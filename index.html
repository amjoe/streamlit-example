<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PickShare — Community Garden Sharing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --ps-bg: #F6F1E8;
      --ps-surface: #FFFDF8;
      --ps-ink: #1F2A20;
      --ps-ink-2: #4B5A4D;
      --ps-ink-3: #8A968B;
      --ps-line: #E5DECF;
      --ps-green: #2F4A2A;
      --ps-green-2: #527A47;
      --ps-citrus: #E8843B;
      --ps-lemon: #E6C04B;
      --ps-lime: #B7C25A;
      --ps-berry: #B24A48;
      --serif: 'Instrument Serif', 'Iowan Old Style', Georgia, serif;
      --sans: 'Inter Tight', -apple-system, system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      font-family: var(--sans);
      background: #EFE8DA;
      color: var(--ps-ink);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow: hidden;
    }

    #root {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }

    /* iPhone frame */
    .ps-device {
      width: 390px; height: 844px;
      border-radius: 54px;
      background: #1F2A20;
      padding: 12px;
      box-shadow: 0 40px 80px rgba(31,42,32,0.28), 0 0 0 1px rgba(31,42,32,0.1);
      position: relative;
      flex-shrink: 0;
    }
    .ps-device-inner {
      width: 100%; height: 100%;
      border-radius: 42px;
      overflow: hidden;
      position: relative;
      background: var(--ps-bg);
    }
    .ps-island {
      position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
      width: 120px; height: 32px; border-radius: 999px;
      background: #000; z-index: 100; pointer-events: none;
    }
    .ps-home-bar {
      position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
      width: 134px; height: 4.5px; border-radius: 999px;
      background: rgba(31,42,32,0.32); z-index: 99; pointer-events: none;
    }

    /* Screen base */
    .ps-screen {
      width: 100%; height: 100%;
      background: var(--ps-bg);
      font-family: var(--sans);
      color: var(--ps-ink);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .ps-serif { font-family: var(--serif); font-weight: 400; letter-spacing: -0.01em; }

    button {
      font-family: inherit;
      cursor: pointer;
      border: 0;
      background: transparent;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { opacity: 0.8; }

    input {
      font-family: inherit;
    }

    .ps-scroll::-webkit-scrollbar { display: none; }
    .ps-scroll { scrollbar-width: none; -webkit-overflow-scrolling: touch; }

    /* Responsive: on small screens show app full-width */
    @media (max-width: 430px) {
      .ps-device {
        width: 100vw; height: 100vh;
        border-radius: 0; padding: 0;
        box-shadow: none;
      }
      .ps-device-inner {
        border-radius: 0;
      }
      .ps-island { display: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─── Icons ────────────────────────────────────────────────────────────────
    const Icon = {
      Sprout: ({ size = 22, color = 'currentColor' }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
          <path d="M12 21V11" stroke={color} strokeWidth="1.6" strokeLinecap="round"/>
          <path d="M12 11C12 8 9.5 5.5 6.5 5.5C5 5.5 4 6 4 6C4 6 4.5 11 8 11.5C10 11.8 12 11 12 11Z" fill={color} fillOpacity="0.18" stroke={color} strokeWidth="1.4" strokeLinejoin="round"/>
          <path d="M12 13C12 10 14.5 7.5 17.5 7.5C19 7.5 20 8 20 8C20 8 19.5 13 16 13.5C14 13.8 12 13 12 13Z" fill={color} fillOpacity="0.28" stroke={color} strokeWidth="1.4" strokeLinejoin="round"/>
        </svg>
      ),
      Pin: ({ size = 18, color = 'currentColor' }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
          <path d="M12 22s7-7.2 7-12a7 7 0 1 0-14 0c0 4.8 7 12 7 12Z" stroke={color} strokeWidth="1.6"/>
          <circle cx="12" cy="10" r="2.4" stroke={color} strokeWidth="1.6"/>
        </svg>
      ),
      Clock: ({ size = 18, color = 'currentColor' }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" stroke={color} strokeWidth="1.6"/>
          <path d="M12 7v5l3 2" stroke={color} strokeWidth="1.6" strokeLinecap="round"/>
        </svg>
      ),
      Plus: ({ size = 22, color = 'currentColor', strokeW = 2.2 }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
          <path d="M12 5v14M5 12h14" stroke={color} strokeWidth={strokeW} strokeLinecap="round"/>
        </svg>
      ),
      Search: ({ size = 18, color = 'currentColor' }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="6.5" stroke={color} strokeWidth="1.6"/>
          <path d="m20 20-3.5-3.5" stroke={color} strokeWidth="1.6" strokeLinecap="round"/>
        </svg>
      ),
      Chat: ({ size = 18, color = 'currentColor' }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
          <path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4 3.5v-3.5h-.5A1.5 1.5 0 0 1 4 15.5v-9Z" stroke={color} strokeWidth="1.6" strokeLinejoin="round"/>
        </svg>
      ),
      Check: ({ size = 16, color = 'currentColor', stroke = 2 }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
          <path d="m5 12 5 5L20 7" stroke={color} strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      ),
      ChevR: ({ size = 16, color = 'currentColor' }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
          <path d="m9 6 6 6-6 6" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      ),
      ChevL: ({ size = 18, color = 'currentColor' }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
          <path d="m15 6-6 6 6 6" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      ),
      Apple: ({ size = 18, color = '#fff' }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill={color}>
          <path d="M17.05 12.55c-.03-2.66 2.18-3.94 2.28-4-1.24-1.81-3.17-2.06-3.86-2.09-1.64-.17-3.21.97-4.04.97-.85 0-2.13-.95-3.5-.92-1.8.03-3.46 1.04-4.39 2.65-1.87 3.25-.48 8.05 1.34 10.68.89 1.29 1.95 2.74 3.34 2.69 1.34-.05 1.85-.87 3.47-.87 1.61 0 2.07.87 3.49.84 1.44-.02 2.35-1.31 3.23-2.61.62-.91 1.42-2.36 1.45-2.45-.06-.02-2.78-1.07-2.81-4.89ZM14.45 4.7c.74-.9 1.24-2.14 1.1-3.38-1.06.04-2.35.71-3.11 1.6-.69.79-1.29 2.05-1.13 3.27 1.18.09 2.39-.6 3.14-1.49Z"/>
        </svg>
      ),
      Google: ({ size = 18 }) => (
        <svg width={size} height={size} viewBox="0 0 24 24">
          <path d="M21.6 12.23c0-.74-.07-1.45-.19-2.13H12v4.03h5.4c-.23 1.25-.94 2.31-2 3.02v2.51h3.23c1.89-1.74 2.97-4.3 2.97-7.43Z" fill="#4285F4"/>
          <path d="M12 22c2.7 0 4.97-.9 6.63-2.43l-3.23-2.51c-.9.6-2.04.96-3.4.96-2.61 0-4.83-1.76-5.62-4.13H3.04v2.6A10 10 0 0 0 12 22Z" fill="#34A853"/>
          <path d="M6.38 13.89A6 6 0 0 1 6.06 12c0-.66.11-1.3.32-1.89V7.51H3.04A10 10 0 0 0 2 12c0 1.61.39 3.14 1.04 4.49l3.34-2.6Z" fill="#FBBC05"/>
          <path d="M12 6c1.47 0 2.79.51 3.83 1.5l2.86-2.86C16.96 2.99 14.7 2 12 2A10 10 0 0 0 3.04 7.51l3.34 2.6C7.17 7.76 9.39 6 12 6Z" fill="#EA4335"/>
        </svg>
      ),
      Phone: ({ size = 18, color = '#fff' }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
          <path d="M5 5.5C5 4.67 5.67 4 6.5 4h2.2c.8 0 1.48.6 1.59 1.4l.5 3.34c.1.7-.2 1.4-.83 1.74l-1.4.78a13 13 0 0 0 5.18 5.18l.78-1.4c.34-.62 1.05-.93 1.74-.83l3.34.5c.8.11 1.4.79 1.4 1.59v2.2c0 .83-.67 1.5-1.5 1.5C10.61 20 4 13.39 4 5.5Z" fill={color}/>
        </svg>
      ),
      Star: ({ size = 14, color = '#E8843B' }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill={color} stroke={color} strokeWidth="1.5" strokeLinejoin="round">
          <path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.8 1-6.1L3.2 9.4l6.1-.9L12 3Z"/>
        </svg>
      ),
      Verified: ({ size = 14, color = '#2F4A2A' }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill={color}>
          <path d="m12 1.5 2.6 1.9 3.2-.3.9 3.1 2.7 1.8-1 3.1 1 3.1-2.7 1.8-.9 3.1-3.2-.3L12 22.5 9.4 20.6l-3.2.3-.9-3.1L2.6 16l1-3.1-1-3.1 2.7-1.8.9-3.1 3.2.3L12 1.5Z"/>
          <path d="m8 12 3 3 5-6" stroke="#fff" strokeWidth="1.8" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      ),
      Heart: ({ size = 18, color = 'currentColor', filled = false }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill={filled ? color : 'none'} stroke={color} strokeWidth="1.6">
          <path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10Z"/>
        </svg>
      ),
      Share: ({ size = 18, color = 'currentColor' }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
          <path d="M12 3v12M12 3l-4 4M12 3l4 4M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5" stroke={color} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      ),
      Settings: ({ size = 18, color = 'currentColor' }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="3" stroke={color} strokeWidth="1.6"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1A2 2 0 1 1 4.4 17l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" stroke={color} strokeWidth="1.4"/>
        </svg>
      ),
      Handoff: ({ size = 18, color = 'currentColor' }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
          <path d="M3 13c2-2 4-2 6 0s4 2 6 0M3 9c2-2 4-2 6 0s4 2 6 0M21 13l-3 7M3 17c2-2 4-2 6 0s4 2 6 0" stroke={color} strokeWidth="1.6" strokeLinecap="round"/>
        </svg>
      ),
      Pickup: ({ size = 18, color = 'currentColor' }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
          <path d="M5 8h14l-1.5 11a2 2 0 0 1-2 1.7h-7a2 2 0 0 1-2-1.7L5 8Z" stroke={color} strokeWidth="1.6" strokeLinejoin="round"/>
          <path d="M9 8a3 3 0 0 1 6 0" stroke={color} strokeWidth="1.6" strokeLinecap="round"/>
        </svg>
      ),
      Either: ({ size = 18, color = 'currentColor' }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
          <path d="M7 7h11l-2-3M17 17H6l2 3" stroke={color} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      ),
      TabHome: ({ active, color }) => (
        <svg width="24" height="24" viewBox="0 0 24 24" fill={active ? color : 'none'} stroke={color} strokeWidth="1.6">
          <path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1v-8Z" strokeLinejoin="round"/>
        </svg>
      ),
      TabMap: ({ active, color }) => (
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.6">
          <path d="m3 6 6-2 6 2 6-2v14l-6 2-6-2-6 2V6Z" strokeLinejoin="round" fill={active ? color : 'none'} fillOpacity={active ? 0.15 : 0}/>
          <path d="M9 4v16M15 6v16"/>
        </svg>
      ),
      TabInbox: ({ active, color }) => (
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.6">
          <path d="M4 13V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-1" strokeLinejoin="round" fill={active ? color : 'none'} fillOpacity={active ? 0.15 : 0}/>
          <path d="M4 13h4l1.5 2h5L16 13h4" strokeLinejoin="round"/>
        </svg>
      ),
      TabProfile: ({ active, color }) => (
        <svg width="24" height="24" viewBox="0 0 24 24" fill={active ? color : 'none'} stroke={color} strokeWidth="1.6" fillOpacity={active ? 0.15 : 1}>
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" strokeLinecap="round"/>
        </svg>
      ),
    };

    // ─── Status Bar ───────────────────────────────────────────────────────────
    function StatusBar({ dark = false }) {
      const c = dark ? '#fff' : '#1F2A20';
      return (
        <div style={{
          height: 50, display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          padding: '14px 28px 0', position: 'relative', zIndex: 10, flexShrink: 0,
        }}>
          <span style={{ fontWeight: 600, fontSize: 16, color: c, letterSpacing: -0.2 }}>9:41</span>
          <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
            <svg width="17" height="11" viewBox="0 0 17 11">
              <rect x="0" y="7" width="3" height="4" rx="0.6" fill={c}/>
              <rect x="4.5" y="5" width="3" height="6" rx="0.6" fill={c}/>
              <rect x="9" y="2.5" width="3" height="8.5" rx="0.6" fill={c}/>
              <rect x="13.5" y="0" width="3" height="11" rx="0.6" fill={c}/>
            </svg>
            <svg width="15" height="11" viewBox="0 0 15 11" fill={c}>
              <path d="M7.5 2.8c2 0 3.9.8 5.2 2.1l1-1A8.5 8.5 0 0 0 7.5 1.4 8.5 8.5 0 0 0 1.3 4l1 1c1.4-1.3 3.2-2.1 5.2-2.1Z"/>
              <path d="M7.5 6c1.2 0 2.3.4 3.1 1.2l1-1A6 6 0 0 0 7.5 4.5 6 6 0 0 0 3.4 6.2l1 1c.8-.8 1.9-1.2 3.1-1.2Z"/>
              <circle cx="7.5" cy="9.3" r="1.3"/>
            </svg>
            <svg width="24" height="11" viewBox="0 0 24 11">
              <rect x="0.5" y="0.5" width="20" height="10" rx="2.5" stroke={c} strokeOpacity="0.4" fill="none"/>
              <rect x="2" y="2" width="17" height="7" rx="1.5" fill={c}/>
              <rect x="21.5" y="3.5" width="1.2" height="4" rx="0.5" fill={c} fillOpacity="0.5"/>
            </svg>
          </div>
        </div>
      );
    }

    // ─── Produce Tile ─────────────────────────────────────────────────────────
    function ProduceTile({ glyph = '🍋', tint = '#E6C04B', size = 80, radius = 16 }) {
      return (
        <div style={{
          width: size, height: size, borderRadius: radius, flexShrink: 0,
          background: `repeating-linear-gradient(135deg, ${tint}33 0 6px, ${tint}1a 6px 12px)`,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontSize: size * 0.5,
          boxShadow: 'inset 0 0 0 1px rgba(31,42,32,0.06)',
        }}>
          <span style={{ filter: 'saturate(1.05)' }}>{glyph}</span>
        </div>
      );
    }

    // ─── Tab Bar ──────────────────────────────────────────────────────────────
    function TabBar({ active = 'home', onNavigate }) {
      const tabs = [
        { k: 'home',    label: 'Feed',    Icon: Icon.TabHome },
        { k: 'map',     label: 'Map',     Icon: Icon.TabMap },
        { k: 'inbox',   label: 'Inbox',   Icon: Icon.TabInbox },
        { k: 'profile', label: 'Profile', Icon: Icon.TabProfile },
      ];
      return (
        <div style={{
          position: 'absolute', left: 0, right: 0, bottom: 0,
          paddingBottom: 28, paddingTop: 10,
          background: 'linear-gradient(180deg, rgba(246,241,232,0) 0%, var(--ps-bg) 30%)',
          display: 'flex', justifyContent: 'space-around', alignItems: 'center',
          zIndex: 5,
        }}>
          {tabs.map(t => {
            const isActive = t.k === active;
            const c = isActive ? '#2F4A2A' : '#8A968B';
            return (
              <button key={t.k} onClick={() => onNavigate && onNavigate(t.k)} style={{
                display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3,
                padding: '6px 14px',
              }}>
                <t.Icon active={isActive} color={c} />
                <span style={{ fontSize: 10.5, fontWeight: 600, color: c, letterSpacing: 0.1 }}>
                  {t.label}
                </span>
              </button>
            );
          })}
        </div>
      );
    }

    // ─── Chip ─────────────────────────────────────────────────────────────────
    function Chip({ children, active = false, onClick, icon }) {
      return (
        <button onClick={onClick} style={{
          display: 'inline-flex', alignItems: 'center', gap: 6,
          padding: '8px 14px', borderRadius: 999, fontSize: 13, fontWeight: 600,
          background: active ? 'var(--ps-green)' : 'rgba(255,253,248,0.9)',
          color: active ? '#F6F1E8' : 'var(--ps-ink)',
          border: active ? '1px solid var(--ps-green)' : '1px solid var(--ps-line)',
          whiteSpace: 'nowrap',
          transition: 'background .15s, color .15s',
        }}>
          {icon}
          {children}
        </button>
      );
    }

    // ─── Data ─────────────────────────────────────────────────────────────────
    const LISTINGS = [
      { id: 'l1', glyph: '🍋', tint: '#E6C04B', title: 'Meyer lemons',        qty: '~30 lemons',       host: 'Diane K.',  dist: '0.2 mi', when: 'Today · 4–6 PM',      handoff: 'self',    addr: '24 Willow Lane' },
      { id: 'l2', glyph: '🍊', tint: '#E8843B', title: 'Navel oranges',       qty: '2 grocery bags',   host: 'Marco V.',  dist: '0.4 mi', when: 'Sat · 9–11 AM',       handoff: 'either',  addr: '108 Creekside Dr' },
      { id: 'l3', glyph: '🥬', tint: '#B7C25A', title: 'Swiss chard + kale',  qty: '6 bunches',        host: 'Priya R.',  dist: '0.6 mi', when: 'Tomorrow · 5–7 PM',   handoff: 'handoff', addr: '17 Acorn Ct' },
      { id: 'l4', glyph: '🍅', tint: '#B24A48', title: 'Heirloom tomatoes',   qty: '~4 lbs',           host: 'Tom W.',    dist: '0.7 mi', when: 'Today · 6–8 PM',      handoff: 'self',    addr: '52 Birch Hollow' },
      { id: 'l5', glyph: '🌿', tint: '#527A47', title: 'Fresh basil + mint',  qty: 'Big bunches',      host: 'Aisha L.',  dist: '0.9 mi', when: 'Sun · all day',        handoff: 'either',  addr: '9 Maple Row' },
    ];

    const HANDOFF_LABELS = {
      self:    { label: 'Self pick-up', I: Icon.Pickup },
      handoff: { label: "I'll hand off", I: Icon.Handoff },
      either:  { label: 'Either works', I: Icon.Either },
    };

    // ═══════════════════════════════════════════════════════════════════════════
    // SCREEN 1 — Welcome
    // ═══════════════════════════════════════════════════════════════════════════
    function ScreenWelcome({ onGetVerified, onSignIn }) {
      return (
        <div className="ps-screen" style={{ background: 'var(--ps-green)' }}>
          <StatusBar dark />
          <div style={{

          {/* Sheet header */}

            <button onClick={onBack} style={{ fontSize: 14, fontWeight: 500, color: 'var(--ps-ink-3)' }}>Cancel</button>
            <div style={{ fontSize: 14, fontWeight: 700 }}>Share harvest</div>
            <button style={{ fontSize: 14, fontWeight: 600, color: 'var(--ps-citrus)' }}>Save draft</button>
          </div>

          <div style={{ flex: 1, overflowY: 'auto', padding: '8px 22px 120px' }} className="ps-scroll">
            {/* Produce picker */}
            <div style={{ fontSize: 12, fontWeight: 700, textTransform: 'uppercase', letterSpacing: 0.6, color: 'var(--ps-ink-2)', marginTop: 8 }}>
              What's growing?
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 10, marginTop: 10 }}>
              {PRODUCE.map((p, i) => {
                const active = i === pick;
                return (
                  <button key={p.n} onClick={() => setPick(i)} style={{
                    padding: '10px 6px', borderRadius: 14,
                    background: active ? `${p.t}26` : '#FFFDF8',
                    border: active ? `1.5px solid ${p.t}` : '1px solid var(--ps-line)',
                    display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4,
                  }}>
                    <div style={{ fontSize: 26, lineHeight: 1 }}>{p.g}</div>
                    <div style={{ fontSize: 11, fontWeight: 600, color: active ? 'var(--ps-ink)' : 'var(--ps-ink-2)' }}>{p.n}</div>
                  </button>
                );
              })}
            </div>

            {/* Title input */}
            <div style={{ marginTop: 22, fontSize: 12, fontWeight: 700, textTransform: 'uppercase', letterSpacing: 0.6, color: 'var(--ps-ink-2)' }}>
              Title
            </div>
            <div style={{
              marginTop: 8, height: 50, borderRadius: 14, background: '#FFFDF8',
              border: '1px solid var(--ps-line)', padding: '0 14px',
              display: 'flex', alignItems: 'center',
            }}>
              <input defaultValue="Meyer lemons — pick your own" style={{
                flex: 1, border: 0, outline: 'none', background: 'transparent',
                fontSize: 15, fontWeight: 500, color: 'var(--ps-ink)', fontFamily: 'inherit',
              }} />
            </div>

            {/* Quantity */}
            <div style={{ marginTop: 16, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
              <div>
                <div style={{ fontSize: 12, fontWeight: 700, textTransform: 'uppercase', letterSpacing: 0.6, color: 'var(--ps-ink-2)' }}>Quantity</div>
                <div style={{
                  marginTop: 8, height: 50, borderRadius: 14, background: '#FFFDF8',
                  border: '1px solid var(--ps-line)', padding: '0 14px',
                  display: 'flex', alignItems: 'center', fontSize: 15, fontWeight: 500,
                }}>~30</div>
              </div>
              <div>
                <div style={{ fontSize: 12, fontWeight: 700, textTransform: 'uppercase', letterSpacing: 0.6, color: 'var(--ps-ink-2)' }}>Per pickup limit</div>
                <div style={{
                  marginTop: 8, height: 50, borderRadius: 14, background: '#FFFDF8',
                  border: '1px solid var(--ps-line)', padding: '0 14px',
                  display: 'flex', alignItems: 'center', fontSize: 15, fontWeight: 500,
                }}>10 ea</div>
              </div>
            </div>

            {/* Handoff toggle */}
            <div style={{ marginTop: 22, fontSize: 12, fontWeight: 700, textTransform: 'uppercase', letterSpacing: 0.6, color: 'var(--ps-ink-2)' }}>
              Handoff style
            </div>
            <div style={{ marginTop: 10, display: 'flex', flexDirection: 'column', gap: 8 }}>
              {[
                { k: 'self',    t: 'Self pick-up',   s: 'Leave it on the porch — folks come grab during slots.', I: Icon.Pickup },
                { k: 'handoff', t: "I'll hand off",  s: 'Meet at the door at the time slot. Say hi.',            I: Icon.Handoff },
                { k: 'either',  t: 'Either works',   s: 'Pickers choose what they prefer.',                      I: Icon.Either },
              ].map(opt => {
                const active = handoff === opt.k;
                return (
                  <button key={opt.k} onClick={() => setHandoff(opt.k)} style={{
                    textAlign: 'left', padding: 14, borderRadius: 14,
                    background: active ? 'rgba(82,122,71,0.1)' : '#FFFDF8',
                    border: active ? '1.5px solid var(--ps-green)' : '1px solid var(--ps-line)',
                    display: 'flex', alignItems: 'center', gap: 12,
                  }}>
                    <div style={{
                      width: 36, height: 36, borderRadius: 10,
                      background: active ? 'var(--ps-green)' : 'var(--ps-bg)',
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                    }}>
                      <opt.I size={18} color={active ? '#F6F1E8' : '#1F2A20'} />
                    </div>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 14, fontWeight: 600 }}>{opt.t}</div>
                      <div style={{ fontSize: 12, color: 'var(--ps-ink-2)', marginTop: 2 }}>{opt.s}</div>
                    </div>
                    <div style={{
                      width: 22, height: 22, borderRadius: 999,
                      border: active ? '0' : '1.5px solid var(--ps-line)',
                      background: active ? 'var(--ps-green)' : 'transparent',
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                      flexShrink: 0,
                    }}>
                      {active && <Icon.Check size={12} color="#F6F1E8" stroke={2.6} />}
                    </div>
                  </button>
                );
              })}
            </div>

            {/* Slot builder */}
            <div style={{ marginTop: 22, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <div style={{ fontSize: 12, fontWeight: 700, textTransform: 'uppercase', letterSpacing: 0.6, color: 'var(--ps-ink-2)' }}>
                Time slots
              </div>
              <button
                onClick={() => setSlots([...slots, { day: 'Sun', range: '2–4 PM' }])}
                style={{ display: 'inline-flex', alignItems: 'center', gap: 4, fontSize: 12, fontWeight: 600, color: 'var(--ps-citrus)' }}
              >
                <Icon.Plus size={14} color="#E8843B" strokeW={2.4} /> Add slot
              </button>
            </div>
            <div style={{ marginTop: 10, display: 'flex', flexDirection: 'column', gap: 8 }}>
              {slots.map((s, i) => (
                <div key={i} style={{
                  padding: '12px 14px', borderRadius: 14, background: '#FFFDF8',
                  border: '1px solid var(--ps-line)',
                  display: 'flex', alignItems: 'center', gap: 12,
                }}>
                  <div style={{ width: 44, textAlign: 'center' }}>
                    <div className="ps-serif" style={{ fontSize: 16, lineHeight: 1 }}>{s.day}</div>
                  </div>
                  <div style={{ width: 1, height: 24, background: 'var(--ps-line)' }} />
                  <div style={{ flex: 1, fontSize: 14, fontWeight: 500 }}>{s.range}</div>
                  <div style={{ fontSize: 11, color: 'var(--ps-ink-3)' }}>5 spots</div>
                </div>
              ))}
            </div>
          </div>

          {/* Sticky CTA */}
          <div style={{
            position: 'absolute', left: 0, right: 0, bottom: 0,
            padding: '12px 22px 30px',
            background: 'linear-gradient(180deg, rgba(246,241,232,0) 0%, var(--ps-bg) 30%)',
          }}>
            <button onClick={onPost} style={{
              width: '100%', height: 54, borderRadius: 16, background: 'var(--ps-green)',
              color: '#F6F1E8', fontSize: 15, fontWeight: 600,
              display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,
            }}>
              Post to Willow Creek <Icon.ChevR size={16} color="#F6F1E8" />
            </button>
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // SCREEN 6 — Profile
    // ═══════════════════════════════════════════════════════════════════════════
    function ScreenProfile({ onBack }) {
      return (
        <div className="ps-screen">
          <StatusBar />
          <div style={{ padding: '8px 22px 0', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <button onClick={onBack} style={{
              width: 36, height: 36, borderRadius: 12, background: '#FFFDF8',
              border: '1px solid var(--ps-line)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
            }}>
              <Icon.ChevL size={16} color="#1F2A20" />
            </button>
            <button style={{
              width: 36, height: 36, borderRadius: 12, background: '#FFFDF8',
              border: '1px solid var(--ps-line)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
            }}>
              <Icon.Settings size={16} color="#1F2A20" />
            </button>
          </div>

          <div style={{ flex: 1, overflowY: 'auto', padding: '14px 22px 100px' }} className="ps-scroll">
            {/* Identity */}
            <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', textAlign: 'center', padding: '8px 0 18px' }}>
              <div style={{
                width: 96, height: 96, borderRadius: 999, background: '#B7C25A',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                fontSize: 32, fontWeight: 700, color: 'var(--ps-green)',
                border: '4px solid #FFFDF8',
                boxShadow: '0 8px 28px rgba(31,42,32,0.12)',
              }}>JM</div>
              <h1 className="ps-serif" style={{ fontSize: 28, margin: '14px 0 0', letterSpacing: -0.01 }}>Jordan Mehta</h1>
              <div style={{
                display: 'inline-flex', alignItems: 'center', gap: 5, marginTop: 6,
                padding: '4px 10px', borderRadius: 999,
                background: 'rgba(82,122,71,0.12)', fontSize: 12, fontWeight: 600, color: 'var(--ps-green)',
              }}>
                <Icon.Verified size={13} /> Verified · Willow Creek HOA
              </div>
              <div style={{ fontSize: 12, color: 'var(--ps-ink-3)', marginTop: 6 }}>Joined March 2024 · Birch Hollow</div>
            </div>

            {/* Stats */}
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 8 }}>
              {[['18', 'shared', 'var(--ps-green)'], ['7', 'picked up', 'var(--ps-citrus)'], ['4.9', 'rating', 'var(--ps-ink)']].map(([n, l, c]) => (
                <div key={l} style={{
                  padding: '14px 10px', borderRadius: 14, background: '#FFFDF8',
                  border: '1px solid var(--ps-line)', textAlign: 'center',
                }}>
                  <div className="ps-serif" style={{ fontSize: 28, color: c, lineHeight: 1 }}>{n}</div>
                  <div style={{ fontSize: 11, color: 'var(--ps-ink-2)', marginTop: 4, fontWeight: 500 }}>{l}</div>
                </div>
              ))}
            </div>

            {/* Currently sharing */}
            <div style={{ marginTop: 20, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <div style={{ fontSize: 12, fontWeight: 700, textTransform: 'uppercase', letterSpacing: 0.6, color: 'var(--ps-ink-2)' }}>
                Currently sharing
              </div>
              <span style={{ fontSize: 12, fontWeight: 600, color: 'var(--ps-citrus)' }}>Manage</span>
            </div>
            <div style={{
              marginTop: 10, padding: 12, borderRadius: 14, background: '#FFFDF8',
              border: '1px solid var(--ps-line)', display: 'flex', gap: 12, alignItems: 'center',
            }}>
              <ProduceTile glyph="🍋" tint="#E6C04B" size={48} radius={12} />
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 14, fontWeight: 600 }}>Meyer lemons</div>
                <div style={{ fontSize: 12, color: 'var(--ps-ink-2)' }}>3 reservations · 12 left</div>
              </div>
              <Icon.ChevR size={16} color="#8A968B" />
            </div>

            {/* Settings list */}
            <div style={{ marginTop: 20, fontSize: 12, fontWeight: 700, textTransform: 'uppercase', letterSpacing: 0.6, color: 'var(--ps-ink-2)' }}>
              Settings
            </div>
            <div style={{ marginTop: 10, borderRadius: 14, background: '#FFFDF8', border: '1px solid var(--ps-line)', overflow: 'hidden' }}>
              {[
                ['Pickup radius',       '1 mile'],
                ['Notifications',       'On'],
                ['Address visibility',  'Street only'],
                ['Block list',          '0'],
              ].map(([k, v], i, arr) => (
                <div key={k} style={{
                  display: 'flex', alignItems: 'center', padding: '14px 16px',
                  borderBottom: i < arr.length - 1 ? '1px solid var(--ps-line)' : 'none',
                }}>
                  <div style={{ flex: 1, fontSize: 14, fontWeight: 500 }}>{k}</div>
                  <div style={{ fontSize: 13, color: 'var(--ps-ink-3)', marginRight: 8 }}>{v}</div>
                  <Icon.ChevR size={14} color="#8A968B" />
                </div>
              ))}
            </div>

            <button style={{
              width: '100%', marginTop: 22, height: 48, borderRadius: 14,
              color: 'var(--ps-berry)', fontSize: 14, fontWeight: 600,
            }}>
              Sign out
            </button>
          </div>

          <TabBar active="profile" onNavigate={() => {}} />
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // App — Router
    // ═══════════════════════════════════════════════════════════════════════════
    function App() {
      const [route, setRoute]           = useState('welcome');
      const [activeListing, setActiveListing] = useState('l1');

      function go(screen) { setRoute(screen); }

      let screen;
      switch (route) {
        case 'welcome':
          screen = (
            <ScreenWelcome
              onGetVerified={() => go('verify')}
              onSignIn={() => go('feed')}
            />
          );
          break;
        case 'verify':
          screen = (
            <ScreenVerify
              onBack={() => go('welcome')}
              onContinue={() => go('feed')}
            />
          );
          break;
        case 'feed':
          screen = (
            <ScreenFeed
              onOpenListing={id => { setActiveListing(id); go('detail'); }}
              onOpenCreate={() => go('create')}
              onOpenProfile={() => go('profile')}
            />
          );
          break;
        case 'detail':
          screen = (
            <ScreenDetail
              listingId={activeListing}
              onBack={() => go('feed')}
            />
          );
          break;
        case 'create':
          screen = (
            <ScreenCreate
              onBack={() => go('feed')}
              onPost={() => go('feed')}
            />
          );
          break;
        case 'profile':
          screen = (
            <ScreenProfile
              onBack={() => go('feed')}
            />
          );
          break;
        default:
          screen = <ScreenFeed onOpenListing={id => { setActiveListing(id); go('detail'); }} onOpenCreate={() => go('create')} onOpenProfile={() => go('profile')} />;
      }

      return (
        <div className="ps-device">
          <div className="ps-island" />
          <div className="ps-device-inner">
            {screen}
          </div>
          <div className="ps-home-bar" />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
